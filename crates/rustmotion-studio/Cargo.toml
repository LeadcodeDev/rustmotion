[package]
name = "rustmotion-studio"
version = "0.6.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rustmotion-studio"
path = "src/bin/main.rs"

[dependencies]
rustmotion = { path = "../rustmotion" }
clap = { version = "4", features = ["derive"] }
skia-safe = "0.82"
winit = "0.30"
softbuffer = "0.4"
rfd = "0.15"
notify = "7"
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
