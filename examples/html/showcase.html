<rustmotion width="1920" height="1080" fps="30" background="#0f172a">
  <!-- Font declarations: <font family="..." path="..."> or <font family="..." src="..."> -->
  <font family="Inter" path="fonts/Inter-Regular.ttf">
  <font family="JetBrainsMono" path="fonts/JetBrainsMono-Regular.ttf">

  <!-- Scene 1: plain color background; compact-DSL entrance animations -->
  <scene duration="3" background="#0f172a" transition="fade" transition-duration="0.6" transition-easing="ease_in_out">
    <div style="flex-direction:column; align-items:center; gap:24">
      <h1 style="font-size:96; color:#ffffff; font-family:Inter; text-align:center" anim="fade-in-up duration:0.8">
        HTML Dialect
      </h1>
      <p style="font-size:40; color:#94a3b8; text-align:center" anim="fade-in delay:0.3 duration:0.6">
        Backgrounds · Transitions · Fonts · Animations
      </p>
    </div>
  </scene>

  <!-- Scene 2: animated halo background; staggered list entrance -->
  <scene duration="4" background='{"preset":"halo","halo":{"zones":[{"color":"#7c3aed","x":0.3,"y":0.4,"radius":0.45},{"color":"#0ea5e9","x":0.7,"y":0.6,"radius":0.35}]},"speed":0}' transition="wipe_left" transition-duration="0.5">
    <div style="flex-direction:column; align-items:center; gap:32">
      <h2 style="font-size:72; color:#ffffff; font-family:Inter; text-align:center" anim="fade-in-up duration:0.6">
        Animated Background
      </h2>
      <rm-card stagger="0.15" style="background:#ffffff10; border-radius:16; padding:32; gap:16; width:720">
        <p style="font-size:34; color:#e2e8f0" anim="fade-in-left duration:0.5">Inline JSON backgrounds</p>
        <p style="font-size:34; color:#e2e8f0" anim="fade-in-left duration:0.5">Parameterized transitions</p>
        <p style="font-size:34; color:#e2e8f0" anim="fade-in-left duration:0.5">Compact animation DSL</p>
      </rm-card>
    </div>
  </scene>

  <!-- Scene 3: grid_dots animated background; JSON-form continuous pulse -->
  <scene duration="3" background='{"preset":"grid_dots","grid_dots":{"color":"#FFFFFF20","element_size":4,"spacing":60},"speed":30,"direction":"up"}' transition="dissolve" transition-duration="0.4" transition-easing="ease_out">
    <div style="flex-direction:column; align-items:center; gap:24">
      <h2 style="font-size:72; color:#38bdf8; font-family:Inter; text-align:center" anim='{"name":"pulse","duration":1.5,"loop":true}'>
        Grid Dots Preset
      </h2>
      <rm-counter from="0" to="1920" suffix="px" style="font-size:80; color:#ffffff; font-family:JetBrainsMono"></rm-counter>
    </div>
  </scene>
</rustmotion>
