name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # webkit/gtk/xdo: required to compile rustmotion-studio (dioxus desktop)
        # asound: required by cpal, which rodio pulls in for preview audio
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # webkit/gtk/xdo: required to compile rustmotion-studio (dioxus desktop)
        # asound: required by cpal, which rodio pulls in for preview audio
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  # Empaquette les crates publiées et les recompile depuis leur tarball. Aucun
  # `cargo test` ne fait ça, et c'est la seule étape qui voit ce qui manque au
  # paquet : la release 0.6.0 s'est arrêtée sur 65 `include_str!` visant un
  # dossier situé hors de la crate, donc absent de l'archive. Sans ce job, cette
  # famille de défaut ne se découvre qu'en publiant — et une publication
  # crates.io ne se défait pas, elle se yanke.
  # La version est déclarée une fois dans [workspace.package] et héritée, mais
  # cargo n'a aucune syntaxe pour injecter cette même version dans une exigence de
  # dépendance interne : [workspace.dependencies] doit porter un littéral, puisque
  # une crate publiée ne peut pas dépendre d'un simple `path`. Rien dans cargo ne
  # vérifie donc que les deux s'accordent, et un désaccord ne se voit qu'à la
  # publication — après que les crates précédentes soient parties.
  version-agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every crate and internal dependency agree on the version
        run: python3 scripts/check-version-agreement.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package publishable crates
        # studio et cli ne sont pas publiées ; les exclure évite d'installer la
        # pile GTK/WebKit ici pour rien.
        run: cargo package --workspace --exclude rustmotion-studio --exclude rustmotion-cli
