name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable channel, 2026-09-22
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install system dependencies
        # xkbcommon-x11/wayland/xcb-cursor: required to LINK rustmotion-studio (gpui).
        # clippy passes without them — it never links — so the failure only shows in tests.
        # asound: required by cpal, which rodio pulls in for preview audio
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev libxcb-cursor-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable channel, 2026-09-22
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install system dependencies
        # xkbcommon-x11/wayland/xcb-cursor: required to LINK rustmotion-studio (gpui).
        # clippy passes without them — it never links — so the failure only shows in tests.
        # asound: required by cpal, which rodio pulls in for preview audio
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev libxcb-cursor-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable channel, 2026-09-22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable channel, 2026-09-22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # Blocking on any advisory not listed below — a newly introduced
      # vulnerability fails this job. Every `--ignore` is a pre-existing
      # transitive-dependency advisory tolerated today because the fix is a
      # dependency version bump, and version bumps for the published
      # `rustmotion` crate are being handled separately from this workstream
      # (crates/rustmotion/Cargo.toml, orchestrator-owned). Unmaintained/
      # unsound/yanked advisories (13 as of 2026-09-25) print but do not fail
      # the job — that's `cargo audit`'s own default, left unchanged here.
      #
      # rustls/rustls-webpki (RUSTSEC-2026-0285, -0104, -0098, -0099, -0049) and
      # crossbeam-epoch (RUSTSEC-2026-0204) were closed 2026-09-25 by a plain
      # `cargo update -p <crate>` — their consumers (ureq; rayon-core <- exr <-
      # image) already accepted the patched semver range, so no Cargo.toml edit
      # was needed. Only the two advisories below have no such path today:
      #
      # Review by 2026-12-22, or sooner once the dependency bumps land:
      #   RUSTSEC-2025-0008 — openh264-sys2 0.6.6, heap overflow in the DECODING path.
      #     `h264.rs` only imports Encoder/YUVBuffer/OpenH264API — no decoder type is ever
      #     constructed, and Cargo.lock's openh264-sys2 pulls in cc/nasm-rs/walkdir, not
      #     libloading, so it is the source-compiled build the advisory itself calls safe at
      #     >=0.6.6 ("if you rely on our `source` feature only, >=0.6.6 should be safe").
      #     `cargo audit` still flags it because its patched-version range (>=0.8.0) only
      #     covers the libloading/prebuilt-DLL path we don't use. Bumping past 0.8.0 would
      #     touch `h264.rs`'s API usage for no reachable fix; left ignored on that basis.
      #   RUSTSEC-2026-0195, RUSTSEC-2026-0194 — quick-xml 0.38.4 / 0.39.4, DoS + quadratic runtime.
      #     0.38.4 reaches the published crates via syntect -> plist. 0.39.4 is
      #     rustmotion-studio-only (Linux/Wayland), via wayland-client/wayland-protocols* ->
      #     wayland-scanner, themselves pulled in by rfd (file dialogs) and gpui-pre-linux
      #     (window backend) — not dioxus-desktop, which is no longer a dependency since the
      #     gpui-kit migration. Fix: >=0.41.0. `cargo update -p quick-xml` has no candidate
      #     today — syntect/plist and wayland-scanner both pin narrower ranges than that, so
      #     closing this needs a Cargo.toml bump in those third-party crates, not just a lock
      #     update (a third, already-fixed instance is in the tree today via `xcb`).
      #   RUSTSEC-2026-0257 — webbrowser 1.2.1, BROWSER env argument injection on Unix.
      #     `webbrowser` is no longer in Cargo.lock at all (it left with dioxus-desktop during the
      #     gpui-kit migration) — this --ignore is currently inert. Left in rather than dropped
      #     silently: re-verify before removing, in case something reintroduces the crate.
      - name: Audit dependencies
        run: >
          cargo audit
          --ignore RUSTSEC-2025-0008
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0257
