name: Publish to crates.io

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not an ancestor of origin/main; refusing to publish from a commit that was never merged."
            exit 1
          fi

      - name: Verify CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | "\(.name)=\(.conclusion)"')
          echo "$runs"
          for job in fmt clippy test audit; do
            if ! echo "$runs" | grep -qx "${job}=success"; then
              echo "::error::CI job '$job' has not succeeded on $GITHUB_SHA; refusing to publish."
              exit 1
            fi
          done

      - name: Install system dependencies
        # Doit rester identique à ci.yaml : l'étape « Run tests » ci-dessous lance
        # `cargo test --workspace`, qui compile ET LIE rustmotion-studio. Sans ces
        # paquets l'édition de liens échoue et la release s'arrête avant toute
        # publication.
        # xkbcommon-x11/wayland/xcb-cursor : exigés par gpui, à l'édition de liens
        # seulement. clippy passe sans eux puisqu'il ne lie pas — la panne
        # n'apparaît donc qu'au job de test. C'est ce qui a cassé le premier CI du
        # chantier gpui (#306) : `-lxkbcommon-x11` introuvable, clippy vert.
        # asound: required by cpal, which rodio pulls in for preview audio
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev libxcb-cursor-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable channel, 2026-09-22

      # La version se lit via `cargo metadata`, pas en grepant un manifeste : elle
      # est déclarée dans `[workspace.package]` et héritée, donc un `grep
      # '^version'` sur la crate tomberait sur `version.workspace = true` et
      # comparerait le tag à cette chaîne. cargo répond la version résolue, où
      # qu'elle soit écrite.
      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="rustmotion") | .version')
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace

      # Repetition deliberee : l'etape suivante empaquette et verifie deja tout
      # avant de televerser, donc ce dry-run recompile les quatre crates une
      # seconde fois et n'attrape rien de plus. Ce qu'il achete est un signal, pas
      # une garantie — un echec ici arrive avant que la commande de publication
      # soit lancee, donc le log dit sans ambiguite que rien n'a pu partir. Apres
      # 0.6.0, qui s'est arretee avec une crate deja publiee, la distinction vaut
      # le temps de compilation.
      - name: Dry-run the workspace publish
        run: cargo publish --workspace --dry-run

      # Un seul appel, et c'est ce qui porte la garantie : cargo empaquette et
      # recompile les quatre crates depuis leur propre tarball AVANT de televerser
      # quoi que ce soit. Si une seule ne se construit pas, rien ne part. Il
      # televerse ensuite dans l'ordre des dependances et attend lui-meme la
      # propagation de l'index.
      #
      # Les sept etapes manuelles qui precedaient interrogeaient
      # https://crates.io/api/v1/crates/<nom>/<version> pour attendre chaque crate.
      # Cet endpoint refuse une requete sans User-Agent identifiant : la boucle ne
      # pouvait donc jamais reussir, et la release 0.6.0 s'est arretee la — apres
      # avoir publie rustmotion-core, definitivement.
      #
      # rustmotion-studio porte `publish = false` : cargo la saute tout seul.
      - name: Publish all crates
        run: cargo publish --workspace --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
